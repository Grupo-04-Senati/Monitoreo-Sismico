# CI de Monitoreo Sísmico: corre en cada push y en cada pull request.
#   - backend: migraciones sobre PostgreSQL vacío + toda la suite de pytest.
#   - frontend: instalación reproducible (package-lock), tipos y build de Vite.
#   - seguridad: ningún .env versionado; auditoría de dependencias (informativa).
#   - despliegue: construye las imágenes de producción, levanta todo con HTTPS
#     (Caddy en localhost), prueba de humo y simulacro de restauración de la copia.
# Las pruebas que necesitan sismos reales se omiten solas en una base vacía; las de
# autorización, reglas, seguridad, configuración, ML e ingesta sí corren.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + migraciones)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sismo
          POSTGRES_PASSWORD: sismo_ci
          POSTGRES_DB: sismo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sismo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: sismo
      POSTGRES_PASSWORD: sismo_ci
      POSTGRES_DB: sismo_db
      API_SECRET_KEY: ci-solo-para-pruebas-no-es-un-secreto-real
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Instalar dependencias
        run: pip install -r services/api/requirements.txt
      - name: Migraciones (subir, bajar una y volver a subir)
        working-directory: services/api
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: Cuenta de administrador desechable (contraseña aleatoria por ejecución)
        working-directory: services/api
        run: |
          export SISMO_ADMIN_PASSWORD="Ci#$(openssl rand -hex 16)"
          python -m app.scripts.crear_admin --email admin-ci@empresa-ejemplo.pe --name "Administrador CI"
      - name: Muestra real del USGS (sin red)
        working-directory: services/api
        run: python -m app.scripts.cargar_muestra ../../tests/fixtures/usgs_peru_2025_m45.json
      - name: Pruebas
        run: python -m pytest tests -q -p no:cacheprovider -rs

  frontend:
    name: Frontend (tipos + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependencias (package-lock)
        run: npm ci
      - name: Tipos y build
        run: npm run build:web

  seguridad:
    name: Seguridad (secretos y dependencias)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ningún archivo .env versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.prod)?$'; then
            echo "::error::Hay un archivo .env en el repositorio: retírelo y rote sus secretos."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Vulnerabilidades conocidas en dependencias de Python (informativo)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vulnerabilidades conocidas en dependencias de Node (informativo)
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

  despliegue:
    name: Despliegue (imágenes + prueba de humo con HTTPS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -f infra/prod/docker-compose.yml --env-file infra/prod/.env.prod
    steps:
      - uses: actions/checkout@v4
      - name: Variables de producción desechables (secretos aleatorios por ejecución)
        run: |
          cat > infra/prod/.env.prod <<EOF
          ENV=production
          SISMO_DOMINIO=localhost
          CORS_ORIGINS=["https://sismo.ci.invalid"]
          POSTGRES_USER=sismo
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          POSTGRES_DB=sismo_db
          API_SECRET_KEY=$(openssl rand -hex 32)
          COOKIE_SECURE=true
          API_DEBUG=false
          DB_ECHO=false
          SISMO_BACKUP_DIR=./backups
          EOF
      - name: Validar docker-compose
        run: $COMPOSE config --quiet
      - name: Construir y levantar (la API arranca en modo producción)
        run: |
          set -o pipefail
          $COMPOSE up -d --build --wait --wait-timeout 300 2>&1 | tee "$RUNNER_TEMP/up.log"
      - name: Prueba de humo por HTTPS
        run: |
          set -e
          curl -kfsS https://localhost/health
          curl -kfsS https://localhost/health/ready | grep -q '"ok"'
          curl -kfsS https://localhost/ | grep -q 'id="root"'
          curl -kfsS https://localhost/eventos | grep -q 'id="root"'
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost/api/v1/auth/me)" = "401"
          curl -ksI https://localhost/ | grep -qi 'strict-transport-security'
          curl -ksI https://localhost/ | grep -qi 'content-security-policy'
          curl -ksI https://localhost/health | grep -qi 'x-frame-options: deny'
          echo "HTTP → $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost/)"
      - name: Copia de seguridad y simulacro de restauración
        run: |
          $COMPOSE exec -T backup sh /scripts/respaldar.sh
          $COMPOSE exec -T backup sh /scripts/simulacro_restauracion.sh
      - name: Registros si algo falló
        if: failure()
        run: |
          $COMPOSE ps -a
          $COMPOSE logs --no-color --tail 200
          # Resumen como anotación: se puede leer sin iniciar sesión en GitHub.
          {
            echo "== servicios"; $COMPOSE ps -a --format '{{.Service}}: {{.State}} {{.Status}}' 2>&1
            echo "== construir y levantar (final)"; tail -n 40 "$RUNNER_TEMP/up.log" 2>/dev/null
            echo "== registros (final)"; $COMPOSE logs --no-color --tail 15 2>&1 | tail -n 60
          } > "$RUNNER_TEMP/resumen.txt"
          texto=$(sed -e 's/%/%25/g' -e 's/\r//g' "$RUNNER_TEMP/resumen.txt" | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Registros del despliegue::${texto}"
      - name: Apagar y borrar volúmenes
        if: always()
        run: $COMPOSE down -v

  e2e:
    name: E2E (Playwright, flujos principales)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sismo
          POSTGRES_PASSWORD: sismo_ci
          POSTGRES_DB: sismo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sismo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: sismo
      POSTGRES_PASSWORD: sismo_ci
      POSTGRES_DB: sismo_e2e
      API_SECRET_KEY: ci-solo-para-pruebas-no-es-un-secreto-real
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Navegador de Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E
        working-directory: apps/web
        run: npm run e2e
