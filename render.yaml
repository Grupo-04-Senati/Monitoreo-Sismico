# Blueprint de Render para la DEMOSTRACIÓN pública de un día (ver docs/DEMO_EN_LINEA.md).
# Crea un servicio web (API + web en el mismo dominio). No es el despliegue de
# producción (ese es infra/prod, D22).
#
# La base PostgreSQL no se crea aquí: el plan gratuito de Render admite una sola base
# por cuenta. Al aplicar el Blueprint, Render pide los datos de conexión (POSTGRES_*) de
# una base ya existente: otra base dentro de una instancia de Render que ya tenga, o una
# gratuita de otro proveedor (p. ej. Neon). Siempre por SSL (POSTGRES_SSL).

services:
  - type: web
    name: sismo-demo
    runtime: docker
    plan: free
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_SSL
        value: "true"
      - key: API_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: API_DEBUG
        value: "false"
      - key: DB_ECHO
        value: "false"
      # La web y la API comparten dominio; CORS solo debe no ser "*" ni localhost.
      - key: CORS_ORIGINS
        value: '["https://sismo-demo.onrender.com"]'
      # Sin Redis en el plan gratuito: un solo proceso, límite de acceso en memoria.
      - key: LOGIN_THROTTLE_BACKEND
        value: memoria
      - key: API_WORKERS
        value: "1"
      # Simulador de sismos ficticios (marcados [SIMULADO]) solo para esta demostración.
      - key: DEMO_SIMULACION
        value: "true"
      # Sin worker en el plan gratuito: la API sincroniza el USGS cada 15 min (D33).
      # El workflow "Demo despierta" la visita cada 5 min para que Render no la duerma.
      - key: SYNC_EN_PROCESO
        value: "true"
      # SMS de avisos (D31). Proveedor: "twilio" o "smsgate" (SMS Gateway for Android,
      # código abierto). Se cambia a mano en Render; las credenciales también (secretas).
      - key: SMS_PROVEEDOR
        sync: false
      - key: SMSGATE_USUARIO
        sync: false
      - key: SMSGATE_CLAVE
        sync: false
      # Twilio: vacíos, los SMS quedan "simulados". El Auth Token es secreto: nunca en el repo.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Cuenta de prueba de Twilio: solo acepta sus plantillas fijas. "true" envía la plantilla
      # y muestra el código en pantalla. Con una cuenta de pago, cambiarlo a "false".
      - key: TWILIO_CUENTA_PRUEBA
        value: "true"
